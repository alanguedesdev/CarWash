<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Fachada low-poly amarela do Meu Lava-Jato com carro vermelho">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f6e7c4"/><stop offset="1" stop-color="#e5c77f"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fff0ce"/><stop offset="1" stop-color="#d8b968"/></linearGradient>
 <linearGradient id="yellow" x2="1" y2="1"><stop stop-color="#ffdf79"/><stop offset="1" stop-color="#d9a936"/></linearGradient>
 <linearGradient id="bay" x2="0" y2="1"><stop stop-color="#1b2a2b"/><stop offset="1" stop-color="#394542"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#eee4c9"/><stop offset="1" stop-color="#c9bd9d"/></linearGradient>
 <linearGradient id="car" x2="0" y2="1"><stop stop-color="#f16d55"/><stop offset="1" stop-color="#b83f37"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#aab9b2"/><stop offset="1" stop-color="#536c6a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect x="0" y="0" width="1600" height="610" fill="url(#wall)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Parede Amarelo-Mostarda Quente (Identidade Original) -->
    <linearGradient id="facadeWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="55%" stop-color="#E5B53B" />
      <stop offset="100%" stop-color="#D49E2A" />
    </linearGradient>

    <!-- Marquise e Detalhes Terracota / Laranja Queimado -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E86A48" />
      <stop offset="100%" stop-color="#C84B2B" />
    </linearGradient>

    <!-- Sombra Sob a Marquise -->
    <linearGradient id="awningShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A2E19" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7A2E19" stop-opacity="0" />
    </linearGradient>

    <!-- Vidros Azul-Petróleo / Ardósia -->
    <linearGradient id="slateGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B8E8E" />
      <stop offset="50%" stop-color="#4A6B6B" />
      <stop offset="100%" stop-color="#2C4242" />
    </linearGradient>

    <!-- Interior da Garagem -->
    <linearGradient id="bayInteriorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142222" />
      <stop offset="100%" stop-color="#223636" />
    </linearGradient>

    <!-- Piso do Pátio (Concreto Claro Quente) -->
    <linearGradient id="patioFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6DEC8" />
      <stop offset="50%" stop-color="#D6CCB4" />
      <stop offset="100%" stop-color="#BFB399" />
    </linearGradient>

    <!-- Lataria do Carro Vermelho Original -->
    <linearGradient id="redCarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350" />
      <stop offset="55%" stop-color="#D84339" />
      <stop offset="100%" stop-color="#AD2E24" />
    </linearGradient>

    <!-- Sombra Projetada Geral -->
    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2D2318" flood-opacity="0.22" />
    </filter>

    <!-- Brilho dos Ícones de Exclamação -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. FUNDO DO PÁTIO E PAREDE PRINCIPAL -->
  <rect width="1920" height="720" fill="url(#facadeWallGrad)" />
  <rect y="715" width="1920" height="365" fill="url(#patioFloorGrad)" />

  <!-- Luz Diagonal Solar na Parede Esquerda (Mantendo o clima da cena original) -->
  <polygon points="0,0 640,0 180,715 0,715" fill="#FFF3B0" opacity="0.28" />
  <line x1="0" y1="715" x2="1920" y2="715" stroke="#B5A68C" stroke-width="6" />

  <!-- Faixas de Sinalização no Chão do Pátio -->
  <polygon points="820,715 1620,715 1740,940 730,940" fill="#EFE8D8" opacity="0.75" />
  <line x1="760" y1="885" x2="1690" y2="885" stroke="#E06D53" stroke-width="8" opacity="0.8" />
  <line x1="745" y1="905" x2="1710" y2="905" stroke="#E06D53" stroke-width="5" opacity="0.55" />

  <!-- 2. ESTRUTURA ARQUITETÔNICA DO LAVA-JATO -->
  <!-- Platibanda / Topo Terracota -->
  <rect x="240" y="0" width="1520" height="68" fill="url(#terracottaGrad)" />
  <rect x="240" y="68" width="1520" height="22" fill="#8C2D19" />

  <!-- Letreiro Central Escuro (Estilo Original) -->
  <g filter="url(#sceneShadow)">
    <rect x="650" y="108" width="660" height="82" rx="8" fill="#162629" />
    <rect x="658" y="116" width="644" height="66" rx="4" fill="none" stroke="#365359" stroke-width="3" />
  </g>

  <!-- Marquise Horizontal Terracota -->
  <g filter="url(#sceneShadow)">
    <rect x="440" y="218" width="1080" height="34" rx="4" fill="url(#terracottaGrad)" />
    <!-- Luminárias Embutidas sob a Marquise -->
    <rect x="570" y="252" width="110" height="12" rx="6" fill="#FFF9C4" />
    <rect x="925" y="252" width="110" height="12" rx="6" fill="#FFF9C4" />
    <rect x="1280" y="252" width="110" height="12" rx="6" fill="#FFF9C4" />
  </g>
  <!-- Sombra projetada da marquise na parede -->
  <rect x="440" y="252" width="1080" height="55" fill="url(#awningShadow)" />

  <!-- Janela Lateral Esquerda (Moldura Azul-Petróleo) -->
  <g>
    <rect x="360" y="290" width="240" height="295" rx="6" fill="#1D3236" />
    <rect x="378" y="308" width="204" height="259" rx="3" fill="url(#slateGlassGrad)" />
    <!-- Reflexo geométrico suave no vidro -->
    <polygon points="378,308 475,308 378,480" fill="#A3C4C4" opacity="0.28" />
    <polygon points="582,390 582,567 450,567" fill="#1D3236" opacity="0.3" />
  </g>

  <!-- Box / Garagem Central-Direita (Onde fica o carro) -->
  <g>
    <!-- Moldura Externa da Garagem -->
    <rect x="750" y="275" width="760" height="440" rx="6" fill="#274045" />
    <!-- Interior Escuro da Garagem -->
    <rect x="775" y="300" width="710" height="415" fill="url(#bayInteriorGrad)" />
    <!-- Detalhes de prateleiras / equipamentos sutis no fundo da garagem -->
    <rect x="830" y="370" width="110" height="48" rx="4" fill="#2B4447" opacity="0.65" />
    <rect x="1080" y="370" width="110" height="48" rx="4" fill="#2B4447" opacity="0.65" />
    <rect x="1310" y="370" width="110" height="48" rx="4" fill="#2B4447" opacity="0.65" />
    <rect x="830" y="490" width="110" height="48" rx="4" fill="#2B4447" opacity="0.45" />
    <rect x="1080" y="490" width="110" height="48" rx="4" fill="#2B4447" opacity="0.45" />
  </g>

  <!-- Pilares Brancos / Creme Verticais (Assinatura Visual do Prédio Original) -->
  <g filter="url(#sceneShadow)">
    <!-- Pilar Esquerdo -->
    <rect x="655" y="242" width="38" height="473" rx="4" fill="#F2ECE1" />
    <rect x="681" y="242" width="12" height="473" fill="#D5CCB8" />
    <!-- Base do Pilar -->
    <rect x="647" y="695" width="54" height="20" rx="3" fill="#B5A68C" />

    <!-- Pilar Direito -->
    <rect x="1520" y="242" width="38" height="473" rx="4" fill="#F2ECE1" />
    <rect x="1546" y="242" width="12" height="473" fill="#D5CCB8" />
    <!-- Base do Pilar -->
    <rect x="1512" y="695" width="54" height="20" rx="3" fill="#B5A68C" />
  </g>

  <!-- Equipamentos Laterais (Tambor Verde à Esquerda e Bancada à Direita) -->
  <g>
    <!-- Tambor / Lixeira Verde Esquerda -->
    <rect x="145" y="510" width="115" height="175" rx="14" fill="#5B9A68" />
    <rect x="225" y="510" width="35" height="175" rx="10" fill="#467A51" />
    <rect x="138" y="502" width="129" height="18" rx="6" fill="#73B580" />
    <!-- Base Terracota -->
    <rect x="115" y="665" width="175" height="50" rx="6" fill="url(#terracottaGrad)" />

    <!-- Bancada / Equipamento Verde-Petróleo à Direita -->
    <rect x="1635" y="475" width="175" height="240" rx="8" fill="#5A7D7C" />
    <rect x="1620" y="460" width="205" height="24" rx="6" fill="#739998" />
    <rect x="1655" y="545" width="135" height="32" rx="4" fill="#3C5756" />
  </g>

  <!-- 3. CARRO VERMELHO EM PERSPECTIVA 3D ESTILIZADA (Fiel ao Original) -->
  <g transform="translate(880, 415)" filter="url(#sceneShadow)">
    <!-- Sombra no Piso sob o Carro -->
    <ellipse cx="290" cy="312" rx="265" ry="28" fill="#2A241D" opacity="0.38" />

    <!-- Cabine / Teto em Perspectiva -->
    <path d="M 145 125 L 220 28 C 235 16, 430 16, 455 32 L 515 125 Z" fill="url(#redCarGrad)" />
    <!-- Teto Iluminado -->
    <path d="M 225 24 L 448 28 L 415 44 L 210 40 Z" fill="#FF7975" opacity="0.7" />

    <!-- Vidros Laterais e Para-brisa -->
    <!-- Para-brisa -->
    <polygon points="160,122 225,38 258,38 205,122" fill="url(#slateGlassGrad)" />
    <polygon points="175,122 230,38 242,38 190,122" fill="#FFFFFF" opacity="0.25" />
    <!-- Janela Lateral -->
    <polygon points="274,38 438,40 485,122 230,122" fill="url(#slateGlassGrad)" />
    <!-- Coluna Central da Porta -->
    <polygon points="348,39 366,39 378,122 358,122" fill="#B83227" />

    <!-- Corpo Principal / Lataria do Carro -->
    <path d="M 55 175 L 95 122 L 520 122 L 555 165 L 555 255 C 555 270, 542 280, 525 280 L 75 280 C 58 280, 48 268, 50 250 Z" fill="url(#redCarGrad)" />
    
    <!-- Vincos e Luz na Lateral da Lataria -->
    <polygon points="95,122 520,122 542,148 75,148" fill="#FF706B" opacity="0.55" />
    <line x1="210" y1="148" x2="485" y2="148" stroke="#9E251B" stroke-width="4" />
    <!-- Maçaneta -->
    <rect x="335" y="165" width="28" height="9" rx="4.5" fill="#7A1C14" />

    <!-- Grade Frontal e Faróis -->
    <polygon points="50,185 110,185 102,222 48,218" fill="#FFF59D" />
    <polygon points="122,188 188,188 184,225 118,225" fill="#263238" />

    <!-- Para-choque Inferior -->
    <path d="M 44 242 L 560 242 L 555 278 L 52 278 Z" fill="#E5DEC9" />
    <rect x="44" y="266" width="514" height="14" rx="4" fill="#B8AF98" />

    <!-- Caixa de Roda e Roda Dianteira -->
    <g transform="translate(165, 268)">
      <circle cx="0" cy="0" r="56" fill="#1C2426" />
      <circle cx="0" cy="0" r="32" fill="#D5CCB8" />
      <circle cx="0" cy="0" r="14" fill="#546E7A" />
    </g>

    <!-- Caixa de Roda e Roda Traseira -->
    <g transform="translate(455, 268)">
      <circle cx="0" cy="0" r="56" fill="#1C2426" />
      <circle cx="0" cy="0" r="32" fill="#D5CCB8" />
      <circle cx="0" cy="0" r="14" fill="#546E7A" />
    </g>
  </g>

  <!-- 4. PLACAS DE EXCLAMAÇÃO FLUTUANTES (Ícone Clássico do Jogo) -->
  <!-- Exclamação Esquerda -->
  <g transform="translate(305, 135)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="110" height="150" rx="12" fill="#16807A" />
    <rect x="8" y="8" width="94" height="134" rx="8" fill="#1E9E96" />
    <rect x="43" y="26" width="24" height="94" rx="6" fill="#F2ECE1" />
    <circle cx="55" cy="172" r="36" fill="#E06344" />
    <circle cx="55" cy="172" r="28" fill="#F0785A" />
  </g>

  <!-- Exclamação Direita -->
  <g transform="translate(1545, 135)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="110" height="150" rx="12" fill="#16807A" />
    <rect x="8" y="8" width="94" height="134" rx="8" fill="#1E9E96" />
    <rect x="43" y="26" width="24" height="94" rx="6" fill="#F2ECE1" />
    <circle cx="55" cy="172" r="36" fill="#E06344" />
    <circle cx="55" cy="172" r="28" fill="#F0785A" />
  </g>
</svg>
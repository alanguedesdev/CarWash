<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
<title id="title">Camila</title><desc id="desc">Personagem 2D do Meu Lava-Jato em estilo cartoon toy-like, com formas orgânicas, volume suave e expressão acolhedora.</desc>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#bd7959"/><stop offset=".58" stop-color="#bd7959"/><stop offset="1" stop-color="#bd7959"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8a5ac4"/><stop offset="1" stop-color="#8a5ac4" /></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#3a2028"/><stop offset="1" stop-color="#3a2028" /></linearGradient>
 <radialGradient id="cheek"><stop stop-color="#e98e83" stop-opacity=".42"/><stop offset="1" stop-color="#e98e83" stop-opacity="0"/></radialGradient>
 <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<!-- sombra de apoio -->
<ellipse cx="200" cy="550" rx="145" ry="13" fill="#263b38" opacity=".12" filter="url(#softShadow)"/>
<!-- busto com silhueta arredondada -->
<path d="M22 560 C30 474 57 428 105 404 C132 390 161 384 200 384 C239 384 268 390 295 404 C343 428 370 474 378 560Z" fill="url(#shirt)"/>
<path d="M145 368 C151 393 150 414 132 430 C151 451 176 463 200 463 C224 463 249 451 268 430 C250 414 249 393 255 368Z" fill="#bd7959"/>
<!-- sombra suave sob o queixo e no pescoço -->
<path d="M145 373 C164 394 181 402 200 402 C219 402 236 394 255 373 L254 417 C231 437 169 437 146 417Z" fill="#754c40" opacity=".16"/>
<!-- cabelo posterior, massa orgânica contínua -->
<path d="M91 183 C75 111 105 47 171 32 C235 17 296 49 313 111 C327 163 307 247 304 304 C299 355 265 389 236 384 L252 191Z" fill="url(#hair)"/>
<g fill="#3a2028"><circle cx="112" cy="100" r="31"/><circle cx="151" cy="75" r="34"/><circle cx="195" cy="67" r="34"/><circle cx="240" cy="76" r="34"/><circle cx="283" cy="106" r="31"/></g>
<!-- orelhas parcialmente integradas à cabeça -->
<path d="M119 224 C94 204 79 224 86 258 C91 284 107 297 126 286Z" fill="#bd7959"/>
<path d="M281 224 C306 204 321 224 314 258 C309 284 293 297 274 286Z" fill="#bd7959"/>

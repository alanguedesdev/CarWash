<path d="M83 203 C63 141 79 73 132 42 C183 12 256 25 294 67 C331 108 321 169 302 211 C280 175 258 151 235 143 C194 173 137 188 83 203Z" fill="url(#hair)"/>
<path d="M117 143 C133 94 169 70 205 70 C245 70 274 92 287 128 C259 108 237 105 215 118 C184 135 151 143 117 143Z" fill="#3a2028" opacity=".72"/>

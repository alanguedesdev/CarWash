<ellipse cx="160" cy="246" rx="15" ry="19" fill="#fffdf8"/><ellipse cx="240" cy="246" rx="15" ry="19" fill="#fffdf8"/>
<ellipse cx="163" cy="249" rx="7" ry="10" fill="#34413d"/><ellipse cx="243" cy="249" rx="7" ry="10" fill="#34413d"/>
<circle cx="165" cy="245" r="3.5" fill="#fff"/><circle cx="245" cy="245" r="3.5" fill="#fff"/>
<!-- nariz pequeno e boca sorridente -->
<path d="M200 255 C190 278 188 291 200 295 C207 297 214 293 218 288" fill="none" stroke="#a96f5d" stroke-width="5" stroke-linecap="round" opacity=".5"/>

<path d="M153 316 C166 309 182 312 200 315 C218 312 234 309 247 316 C239 343 220 356 200 356 C180 356 161 343 153 316Z" fill="#934c4d" opacity=".9"/>
<path d="M169 319 Q200 334 231 319" fill="none" stroke="#fff3e9" stroke-width="7" stroke-linecap="round"/>
<!-- blush suave -->
<ellipse cx="130" cy="286" rx="30" ry="18" fill="url(#cheek)"/><ellipse cx="270" cy="286" rx="30" ry="18" fill="url(#cheek)"/>

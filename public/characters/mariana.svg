<desc id="desc">Retrato ilustrado de cliente do CarWash, enquadrado dos ombros para cima.</desc>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#c98768"/><stop offset="1" stop-color="#c98768"/></linearGradient>
